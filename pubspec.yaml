name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'
        cache: true

    - name: Create Complete Android Project Structure
      run: |
        flutter create . --org com.repair.fabricator --project-name repair_fabricator --platforms=android --overwrite

    - name: Install Dependencies & Pub Get
      run: |
        flutter pub get

    - name: Generate App Icon & Name
      run: |
        dart run flutter_launcher_icons:main
        sed -i 's/android:label="[^"]*"/android:label="লিবিয়ার ফেব্রিকেটর"/g' android/app/src/main/AndroidManifest.xml

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
