name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.x'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Setup Complete Android Structure
      run: |
        mkdir -p android/app/src/main
        MANIFEST_CONTENT='<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.repair.fabricator"><application android:label="Repair Fabricator" android:name="${applicationName}" android:icon="@mipmap/ic_launcher"><activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity><meta-data android:name="flutterEmbedding" android:value="2"/></application></manifest>'
        echo "$MANIFEST_CONTENT" > android/app/src/main/AndroidManifest.xml
        mkdir -p android/app/src/main/res/values
        echo '<resources><string name="app_name">Repair Fabricator</string></resources>' > android/app/src/main/res/values/strings.xml
        echo "$MANIFEST_CONTENT" > android/AndroidManifest.xml

    - name: Generate App Icon
      run: dart run flutter_launcher_icons

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: build/app/outputs/flutter-apk/app-release.apk
        
